<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Reader</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <aside class="sidebar">
    <header class="brand"><span class="mark">M<span>↓</span></span><div>Markdown Reader<small>YOUR LOCAL READING ROOM</small></div></header>
    <section class="folder-info"><span class="eyebrow">OPEN FOLDER</span><strong id="root-name">Loading…</strong><p id="root-path"></p></section>
    <div class="search-wrap"><input id="search" type="search" placeholder="Filter this folder…" aria-label="Filter files and folders"></div>
    <div class="folder-toolbar"><button id="up" title="Parent folder">↑ Up</button><button id="refresh" title="Refresh folder">↻ Refresh</button></div>
    <nav id="files" aria-label="Files and subfolders"></nav>
    <footer class="sidebar-footer"><span class="status-dot"></span> Local files · read only</footer>
  </aside>
  <main>
    <header class="topbar"><nav id="breadcrumbs" aria-label="Breadcrumb"></nav><div class="actions"><select id="theme" title="Choose color theme" aria-label="Color theme"><option value="light">Light</option><option value="dark">Dark</option><option value="sepia">Sepia</option><option value="ocean">Ocean</option></select><button id="print" title="Print document">Print</button></div></header>
    <div id="message" role="status" hidden></div>
    <section id="welcome" class="welcome"><div class="welcome-icon">M↓</div><span class="eyebrow">A LITTLE SPACE TO READ</span><h1>Your notes.<br>A clearer view.</h1><p>Choose a Markdown file from the sidebar.<br>Explore folders, follow links, and settle into a good read.</p><div class="welcome-tip">.md <span>•</span> .markdown <span>•</span> .mdown</div></section>
    <section id="document" hidden><div class="document-meta"><span id="file-label"></span><span id="read-time"></span></div><article id="content" class="markdown"></article><footer class="document-footer" id="modified"></footer></section>
  </main>
</body>
</html>
